services:
  api:
    build: ./api
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/seo?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - API_PORT=${API_PORT:-8080}
      - MODE=${MODE:-development}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - JWT_TTL_SECS=${JWT_TTL_SECS:-3600}
    depends_on: [db, redis]
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    command: >
      sh -c "if [ \"$MODE\" = \"production\" ]; then cargo run --release; else cargo run; fi"

  web:
    build: ./web
    environment:
      - PORT=3000
      - BACKEND_URL=${BACKEND_URL:-http://api:8080/api/v1}
      - NUXT_PUBLIC_BACKEND_URL=${BACKEND_URL:-http://api:8080/api/v1}
      - MODE=${MODE:-development}
    depends_on: [api]
    ports: ["3000:3000"]
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=seo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    ports: ["5433:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  dbdata: {}
