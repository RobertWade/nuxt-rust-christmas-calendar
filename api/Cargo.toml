[package]
name = "rust-fullstack-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "macros", "postgres", "chrono"] }
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1.0"
